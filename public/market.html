<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chợ Giang Hồ — VLTK Web</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f1e1be;background:#111c17}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(145deg,#1d3327,#101710);min-height:100dvh}
    main{max-width:980px;margin:auto;padding:24px 18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #887449;padding-bottom:18px}
    h1{margin:0;font:700 clamp(24px,5vw,36px) Georgia,serif;color:#efd29b}
    a{color:#e9c280}
    p{color:#b8c3b6}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
    .tabs button,.controls button{border:1px solid #a58b59;border-radius:6px;background:#26382c;color:#f3dbb0;padding:10px 15px;cursor:pointer}
    .tabs button[aria-selected="true"]{background:#87652f;color:#fff}
    .tabs button:disabled{opacity:.5;cursor:not-allowed}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input{flex:1;min-width:170px;max-width:510px;color:#fff;background:#09140e;border:1px solid #7e734e;border-radius:6px;padding:12px;font:inherit}
    #message{margin:18px 0;min-height:1.5em}
    #listings{display:grid;gap:10px;margin:18px 0}
    .listing{border:1px solid #65583e;background:#1a291f;border-radius:7px;padding:14px;display:flex;gap:12px;justify-content:space-between;align-items:center}
    .price{color:#f3cf75;font-weight:700;white-space:nowrap}
    .small{font-size:13px;color:#aebbaa}
    .notice{border:1px solid #66583b;background:#27281b;padding:12px 14px;border-radius:6px;margin:20px 0}
  </style>
</head>
<body>
<main>
  <header><h1>Chợ Giang Hồ</h1><a href="/">← Quay lại game</a></header>
  <p id="account">Đang kiểm tra tài khoản…</p>
  <nav class="tabs" aria-label="Chức năng Chợ">
    <button aria-selected="true" type="button">Mua hàng</button>
    <button disabled title="Đang hoàn thiện giao dịch an toàn" type="button">Bày bán</button>
    <button disabled title="Đang hoàn thiện giao dịch an toàn" type="button">Hàng của tôi</button>
  </nav>
  <form id="searchForm" class="controls" role="search">
    <input id="search" maxlength="60" placeholder="Tìm vật phẩm hoặc người bán" aria-label="Tìm kiếm">
    <button type="submit">Tìm kiếm</button>
    <button id="refresh" type="button">Làm mới</button>
  </form>
  <section class="notice" role="note">Danh sách hàng của Chợ được đọc từ Supabase riêng của game. Chức năng đăng bán, mua, hủy bán và nhận hàng chưa được bật; cần xác thực giao dịch và liên kết tài khoản SQLite an toàn trước khi mở.</section>
  <p id="message" role="status"></p>
  <section id="listings" aria-label="Danh sách hàng hóa"></section>
</main>
<script src="/market.js" defer></script>
</body>
</html>

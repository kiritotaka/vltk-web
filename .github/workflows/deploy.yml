name: Verify fork

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Install map editor test dependencies
        run: npx --yes pnpm@10.25.0 --dir tools/map-tool install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm test
# Fork intentionally has NO upstream VPS deployment job.
